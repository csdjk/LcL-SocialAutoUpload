[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "social-auto-upload"
version = "0.1.0"
description = "Social media auto uploader"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "loguru==0.7.3",
  "opencv-python>=4.13.0.92",
  "patchright==1.58.2",
  "qrcode==8.2",
  "requests==2.32.3",
  "segno>=1.6.6",
]

[project.scripts]
sau = "sau_cli:main"
sau-daily = "daily_publish:main"
sau-publisher-mcp = "publisher_mcp:main"
sau-publisher-worker = "publisher_worker:main"
sau-publisher = "publisher_app:main"
sau-publisher-desktop = "publisher_desktop:main"

[project.optional-dependencies]
mcp = ["mcp>=1.26,<2"]
web = [
  "Flask[async]==3.1.1",
  "flask-cors==6.0.0",
  "playwright>=1.58,<2",
]
desktop = ["pywebview>=5,<7", "pystray>=0.19,<1", "Pillow>=11,<13"]

[tool.uv]
package = true

[tool.setuptools]
py-modules = ["cli_main", "conf", "sau_cli", "daily_publish", "publisher_mcp", "publisher_worker", "publisher_app", "publisher_desktop", "sau_backend"]
include-package-data = true

[tool.setuptools.packages.find]
include = ["uploader*", "utils*", "myUtils*", "publishing*"]

[tool.setuptools.package-data]
utils = ["stealth.min.js"]
